<!doctype html>
<html lang="zh-CN" data-state="idle">
  <head>
    <meta charset="utf-8" />
    <!--
      球的窗口。面板已经拆到独立窗口（panel.html），两者互不影响。
      本地页面，不联网；style/script 必须放开 file:（file:// 下 'self' 是 opaque origin）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline' file:; script-src 'self' file:; img-src 'self' file: data:; connect-src 'none'"
    />
    <title>翻译球</title>
    <link rel="stylesheet" href="../../assets/tokens.css" />
    <link rel="stylesheet" href="ball.css" />
  </head>
  <body>
    <!-- 位置与尺寸由主进程推下来（.stage 的内联 left/top/width/height） -->
    <div class="stage" id="stage">
      <button id="ball" class="ball" type="button" title="单击翻译选中的文字 · 拖动移动 · 右键菜单">
        <span class="ring"></span>
        <!-- 两层分工：.orbit 管表情动作（绕圈/缩放），.eye 管跟着鼠标的光标位移。
             两件事都写 transform 的话会互相覆盖 —— 表情一放，眼睛就会抽搐。 -->
        <span class="eyes">
          <span class="orbit" id="orbit">
            <span class="eye l"></span><span class="eye r"></span>
          </span>
        </span>
        <!-- 五官的曲线部分（嘴 + 笑脸的弯眼）都画在这一层：
             viewBox 跟球同心，坐标是球径百分比，线宽用 non-scaling-stroke 锁屏幕像素，
             所以 58px 的小球上也是清楚的细线，不会糊成脏点。 -->
        <svg class="mouth" id="mouth" viewBox="0 0 100 100" aria-hidden="true">
          <path class="happy-eye" id="eye-happy-l" d="M 26 46 Q 32 39 38 46"></path>
          <path class="happy-eye" id="eye-happy-r" d="M 62 46 Q 68 39 74 46"></path>
          <path id="mouth-path" d="M 43 74 Q 50 75 57 74"></path>
        </svg>
      </button>
    </div>
    <script src="ball.js"></script>
  </body>
</html>
